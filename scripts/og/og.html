<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Davion Software, imagen social</title>
    <style>
      @font-face {
        font-family: "Inter";
        font-weight: 500;
        src: url("fonts/inter-500.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0a0a;
        color: #fefefe;
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        position: relative;
        display: flex;
        width: 1200px;
        height: 630px;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .lockup img {
        width: 72px;
        height: 72px;
      }
      .lockup .name {
        display: flex;
        flex-direction: column;
        line-height: 1;
      }
      .lockup .wordmark {
        font-size: 36px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .lockup .category {
        margin-top: 8px;
        color: #d1a744;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.28em;
      }
      h1 {
        max-width: 1000px;
        font-size: 88px;
        font-weight: 500;
        line-height: 1.04;
        letter-spacing: -0.03em;
      }
      h1 span {
        display: block;
        color: #c3c6cb;
      }
      .rule {
        width: 96px;
        height: 4px;
        margin-bottom: 28px;
        border-radius: 2px;
        background: #d1a744;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        color: #c3c6cb;
        font-size: 28px;
        font-weight: 500;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="lockup">
        <img src="../../src/assets/mark.svg" alt="" />
        <div class="name">
          <span class="wordmark">Davion</span>
          <span class="category">SOFTWARE</span>
        </div>
      </div>
      <div>
        <div class="rule"></div>
        <h1>Software para el trabajo <span>que hoy se hace a mano.</span></h1>
      </div>
      <div class="foot">
        <span>Estudio de software independiente en Perú</span>
        <span>davionsoftware.com</span>
      </div>
    </main>
  </body>
</html>
